<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Private AI</title>

    <style>
        :root {
            font-family: Inter, Arial, sans-serif;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111827;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
        }

        .app {
            width: min(900px, 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1f2937;
        }

        .header {
            padding: 18px 20px;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .header-subtitle {
            margin-top: 4px;
            font-size: 13px;
            color: #9ca3af;
        }

        .status {
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #374151;
            white-space: nowrap;
        }

        .status.online {
            background: #065f46;
            color: #d1fae5;
        }

        .status.error {
            background: #7f1d1d;
            color: #fee2e2;
        }

        .settings {
            padding: 12px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            border-bottom: 1px solid #374151;
        }

        input,
        textarea,
        button {
            font: inherit;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #4b5563;
            border-radius: 8px;
            background: #111827;
            color: #f3f4f6;
            padding: 10px 12px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #60a5fa;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.55;
            cursor: default;
        }

        button.secondary {
            background: #4b5563;
        }

        button.secondary:hover:not(:disabled) {
            background: #6b7280;
        }

        button.danger {
            background: #991b1b;
        }

        button.danger:hover:not(:disabled) {
            background: #b91c1c;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 82%;
            border-radius: 12px;
            padding: 12px 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.user {
            align-self: flex-end;
            background: #2563eb;
        }

        .message.assistant {
            align-self: flex-start;
            background: #374151;
        }

        .message.system {
            align-self: center;
            max-width: 95%;
            color: #9ca3af;
            background: transparent;
            font-size: 13px;
            text-align: center;
        }

        .meta {
            display: block;
            margin-top: 8px;
            color: #9ca3af;
            font-size: 11px;
        }

        .composer {
            border-top: 1px solid #374151;
            padding: 14px 20px;
        }

        .composer-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            min-height: 48px;
            max-height: 180px;
            resize: vertical;
        }

        .composer-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: space-between;
        }

        .hint {
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            .settings {
                grid-template-columns: 1fr;
            }

            .message {
                max-width: 92%;
            }

            .header {
                align-items: flex-start;
            }

            .composer-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
<div class="app">
    <header class="header">
        <div>
            <h1>Private AI</h1>

            <div class="header-subtitle">
                Локальная LLM через Ollama
            </div>
        </div>

        <div
                id="status"
                class="status"
        >
            Проверка...
        </div>
    </header>

    <section class="settings">
        <input
                id="apiKey"
                type="password"
                placeholder="Bearer API key"
                autocomplete="off"
        >

        <input
                id="sessionId"
                type="text"
                placeholder="Session ID"
                maxlength="100"
        >

        <button
                id="saveSettingsButton"
                class="secondary"
                type="button"
        >
            Сохранить
        </button>
    </section>

    <main
            id="messages"
            class="messages"
    >
        <div class="message system">
            Укажи API key и начни диалог. История хранится сервером по Session ID.
        </div>
    </main>

    <footer class="composer">
        <div class="composer-row">
            <textarea
                    id="messageInput"
                    maxlength="4000"
                    placeholder="Напиши сообщение..."
            ></textarea>

            <button
                    id="sendButton"
                    type="button"
            >
                Отправить
            </button>
        </div>

        <div class="composer-actions">
            <span class="hint">
                Enter — отправить, Shift+Enter — новая строка
            </span>

            <button
                    id="clearButton"
                    class="danger"
                    type="button"
            >
                Очистить сессию
            </button>
        </div>
    </footer>
</div>

<script>
    const apiKeyInput = document.getElementById("apiKey");
    const sessionIdInput = document.getElementById("sessionId");
    const messageInput = document.getElementById("messageInput");
    const messagesContainer = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const saveSettingsButton = document.getElementById("saveSettingsButton");
    const statusElement = document.getElementById("status");

    initialize();

    async function initialize() {
        apiKeyInput.value = sessionStorage.getItem("privateAiApiKey") || "";

        sessionIdInput.value =
            localStorage.getItem("privateAiSessionId") ||
            createSessionId();

        saveSettings();

        await checkHealth();

        messageInput.focus();
    }

    function createSessionId() {
        if (window.crypto && crypto.randomUUID) {
            return "web-" + crypto.randomUUID();
        }

        return "web-" + Date.now();
    }

    function saveSettings() {
        const apiKey = apiKeyInput.value.trim();
        const sessionId = sessionIdInput.value.trim();

        if (apiKey) {
            sessionStorage.setItem("privateAiApiKey", apiKey);
        } else {
            sessionStorage.removeItem("privateAiApiKey");
        }

        if (sessionId) {
            localStorage.setItem("privateAiSessionId", sessionId);
        }
    }

    function getApiKey() {
        return apiKeyInput.value.trim();
    }

    function getSessionId() {
        return sessionIdInput.value.trim();
    }

    async function checkHealth() {
        try {
            const response = await fetch("/health");
            const body = await response.json();

            if (!response.ok) {
                throw new Error(body.message || "Сервис недоступен");
            }

            statusElement.textContent =
                `${body.status}: ${body.model}`;

            statusElement.className = "status online";
        } catch (error) {
            statusElement.textContent = "Недоступен";
            statusElement.className = "status error";

            addMessage(
                "system",
                `Health check failed: ${error.message}`
            );
        }
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        const apiKey = getApiKey();
        const sessionId = getSessionId();

        if (!apiKey) {
            addMessage("system", "Сначала укажи API key.");
            apiKeyInput.focus();
            return;
        }

        if (!sessionId) {
            addMessage("system", "Session ID не может быть пустым.");
            sessionIdInput.focus();
            return;
        }

        if (!message) {
            return;
        }

        saveSettings();

        addMessage("user", message);

        messageInput.value = "";

        setLoading(true);

        const pendingMessage = addMessage(
            "assistant",
            "Модель формирует ответ..."
        );

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    sessionId: sessionId,
                    message: message
                })
            });

            const body = await readJsonSafely(response);

            if (!response.ok) {
                throw new Error(
                    body.message ||
                    `HTTP ${response.status}`
                );
            }

            pendingMessage.textContent = body.answer;

            const meta = document.createElement("span");
            meta.className = "meta";
            meta.textContent =
                `${body.model} · ${body.durationMillis} ms · ` +
                `история: ${body.historyMessages} сообщений`;

            pendingMessage.appendChild(meta);
        } catch (error) {
            pendingMessage.textContent =
                `Ошибка: ${error.message}`;
        } finally {
            setLoading(false);
            messageInput.focus();
        }
    }

    async function clearSession() {
        const apiKey = getApiKey();
        const sessionId = getSessionId();

        if (!apiKey || !sessionId) {
            addMessage(
                "system",
                "Для очистки нужны API key и Session ID."
            );
            return;
        }

        setLoading(true);

        try {
            const response = await fetch(
                `/api/sessions/${encodeURIComponent(sessionId)}`,
                {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`
                    }
                }
            );

            const body = await readJsonSafely(response);

            if (!response.ok) {
                throw new Error(
                    body.message ||
                    `HTTP ${response.status}`
                );
            }

            messagesContainer.innerHTML = "";

            addMessage(
                "system",
                body.message || "Сессия очищена."
            );
        } catch (error) {
            addMessage(
                "system",
                `Не удалось очистить сессию: ${error.message}`
            );
        } finally {
            setLoading(false);
        }
    }

    function addMessage(role, text) {
        const element = document.createElement("div");

        element.className = `message ${role}`;
        element.textContent = text;

        messagesContainer.appendChild(element);

        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

        return element;
    }

    function setLoading(loading) {
        sendButton.disabled = loading;
        clearButton.disabled = loading;
        messageInput.disabled = loading;
    }

    async function readJsonSafely(response) {
        const text = await response.text();

        if (!text) {
            return {};
        }

        try {
            return JSON.parse(text);
        } catch {
            return {
                message: text
            };
        }
    }

    saveSettingsButton.addEventListener(
        "click",
        () => {
            saveSettings();

            addMessage(
                "system",
                "Настройки сохранены в текущем браузере."
            );

            messageInput.focus();
        }
    );

    sendButton.addEventListener(
        "click",
        sendMessage
    );

    clearButton.addEventListener(
        "click",
        clearSession
    );

    messageInput.addEventListener(
        "keydown",
        event => {
            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {
                event.preventDefault();
                sendMessage();
            }
        }
    );
</script>
</body>
</html>
