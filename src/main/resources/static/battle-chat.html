<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Advent Battle Pipeline</title>
    <style>
        :root { font-family: Inter, Arial, sans-serif; color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; }
        .app { width: min(920px, 100%); min-height: 100vh; display: flex; flex-direction: column; background: #1e293b; }
        .header { padding: 18px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; gap: 12px; }
        .header h1 { margin: 0; font-size: 20px; }
        .subtitle { margin-top: 4px; font-size: 13px; color: #94a3b8; }
        .status { font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #334155; }
        .status.online { background: #065f46; color: #d1fae5; }
        .status.error { background: #7f1d1d; color: #fee2e2; }
        .settings { padding: 12px 20px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; border-bottom: 1px solid #334155; }
        input, textarea, button { font: inherit; }
        input, textarea { width: 100%; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #e2e8f0; padding: 10px 12px; }
        button { border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; background: #2563eb; color: white; }
        button.secondary { background: #475569; }
        button.danger { background: #991b1b; }
        button:disabled { opacity: 0.55; cursor: default; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .message { max-width: 82%; border-radius: 12px; padding: 12px 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
        .message.user { align-self: flex-end; background: #2563eb; }
        .message.assistant { align-self: flex-start; background: #334155; }
        .message.system { align-self: center; max-width: 95%; color: #94a3b8; background: transparent; font-size: 13px; text-align: center; }
        .meta { display: block; margin-top: 8px; color: #94a3b8; font-size: 11px; }
        .composer { border-top: 1px solid #334155; padding: 14px 20px; }
        .composer-row { display: flex; gap: 10px; align-items: flex-end; }
        textarea { min-height: 48px; max-height: 180px; resize: vertical; }
        .composer-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: space-between; }
        .hint { color: #94a3b8; font-size: 12px; }
        @media (max-width: 700px) { .settings { grid-template-columns: 1fr; } .composer-row { flex-direction: column; } }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div>
            <h1>Battle Pipeline</h1>
            <div class="subtitle">Gateway + injection guards + OpenRouter</div>
        </div>
        <div id="status" class="status">Проверка...</div>
    </header>

    <section class="settings">
        <input id="apiKey" type="password" placeholder="Bearer API key (BATTLE_API_KEY)" autocomplete="off">
        <input id="sessionId" type="text" placeholder="Session ID" maxlength="100">
        <button id="saveSettingsButton" class="secondary" type="button">Сохранить</button>
    </section>

    <main id="messages" class="messages">
        <div class="message system">Укажи API key партнёра и начни red-team тест. Все запросы проходят через guards.</div>
    </main>

    <footer class="composer">
        <div class="composer-row">
            <textarea id="messageInput" maxlength="4000" placeholder="Сообщение..."></textarea>
            <button id="sendButton" type="button">Отправить</button>
        </div>
        <div class="composer-actions">
            <span class="hint">Enter — отправить · Shift+Enter — новая строка</span>
            <button id="clearButton" class="danger" type="button">Очистить сессию</button>
        </div>
    </footer>
</div>

<script>
    const apiKeyInput = document.getElementById("apiKey");
    const sessionIdInput = document.getElementById("sessionId");
    const messageInput = document.getElementById("messageInput");
    const messagesContainer = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const saveSettingsButton = document.getElementById("saveSettingsButton");
    const statusElement = document.getElementById("status");

    initialize();

    async function initialize() {
        apiKeyInput.value = sessionStorage.getItem("battleApiKey") || "";
        sessionIdInput.value = localStorage.getItem("battleSessionId") || createSessionId();
        saveSettings();
        await checkHealth();
        messageInput.focus();
    }

    function createSessionId() {
        return window.crypto?.randomUUID ? "battle-" + crypto.randomUUID() : "battle-" + Date.now();
    }

    function saveSettings() {
        const apiKey = apiKeyInput.value.trim();
        const sessionId = sessionIdInput.value.trim();
        if (apiKey) sessionStorage.setItem("battleApiKey", apiKey);
        else sessionStorage.removeItem("battleApiKey");
        if (sessionId) localStorage.setItem("battleSessionId", sessionId);
    }

    async function checkHealth() {
        try {
            const response = await fetch("/health");
            const body = await response.json();
            statusElement.textContent = `${body.status}: ${body.model}`;
            statusElement.className = "status online";
        } catch (error) {
            statusElement.textContent = "Недоступен";
            statusElement.className = "status error";
        }
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        const sessionId = sessionIdInput.value.trim();
        if (!apiKey) { addMessage("system", "Сначала укажи API key."); return; }
        if (!message) return;

        saveSettings();
        addMessage("user", message);
        messageInput.value = "";
        setLoading(true);

        const pending = addMessage("assistant", "Обработка через pipeline...");

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ sessionId, message })
            });

            const body = await readJsonSafely(response);
            if (!response.ok) throw new Error(body.message || `HTTP ${response.status}`);

            pending.textContent = body.answer;
            const meta = document.createElement("span");
            meta.className = "meta";
            const guards = body.guards || {};
            meta.textContent = `${body.model} · ${body.durationMillis}ms · guards: injection=${guards.injectionBlocked}, gateway=${(guards.gatewayInputFindings||[]).join(",")||"clean"}`;
            pending.appendChild(meta);
        } catch (error) {
            pending.textContent = `Ошибка: ${error.message}`;
        } finally {
            setLoading(false);
            messageInput.focus();
        }
    }

    async function clearSession() {
        const apiKey = apiKeyInput.value.trim();
        const sessionId = sessionIdInput.value.trim();
        if (!apiKey || !sessionId) return;

        setLoading(true);
        try {
            const response = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${apiKey}` }
            });
            const body = await readJsonSafely(response);
            if (!response.ok) throw new Error(body.message || `HTTP ${response.status}`);
            messagesContainer.innerHTML = "";
            addMessage("system", body.message || "Сессия очищена.");
        } catch (error) {
            addMessage("system", `Ошибка: ${error.message}`);
        } finally {
            setLoading(false);
        }
    }

    function addMessage(role, text) {
        const element = document.createElement("div");
        element.className = `message ${role}`;
        element.textContent = text;
        messagesContainer.appendChild(element);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return element;
    }

    function setLoading(loading) {
        sendButton.disabled = loading;
        clearButton.disabled = loading;
        messageInput.disabled = loading;
    }

    async function readJsonSafely(response) {
        const text = await response.text();
        if (!text) return {};
        try { return JSON.parse(text); } catch { return { message: text }; }
    }

    saveSettingsButton.addEventListener("click", () => { saveSettings(); addMessage("system", "Настройки сохранены."); });
    sendButton.addEventListener("click", sendMessage);
    clearButton.addEventListener("click", clearSession);
    messageInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
</script>
</body>
</html>
